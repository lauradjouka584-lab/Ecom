<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Djouka Sa'a</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <nav class="navbar navbar-expand-lg navbar-light bg-warning">
                    <!-- Bouton de menu pour mobiles -->
                    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    
                    <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
                        <a class="navbar-brand" href="{% url 'home' %}">Djouka Sah</a>
                        
                        <ul class="navbar-nav mr-auto mt-2 mt-lg-0">
                            <!-- Lien Accueil -->
                            <li class="nav-item active">
                                <a class="nav-link" href="{% url 'home' %}">Accueil <span class="sr-only">(current)</span></a>
                            </li>

                            <!-- Mon Panier -->
                            <li class="nav-item">
                                <button id="panier" type="button" class="btn btn-info" data-html="true" data-container="body" data-toggle="popover" data-placement="bottom" data-content="Votre panier est vide.">
                                    <i class="bi bi-cart-plus me-2"></i>Panier (0)
                                </button>
                            </li>
                            <li class="nav-item dropdown">
                                <!-- Bouton principal du menu déroulant -->
                                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                    <i class="bi bi-grid me-1"></i> Catégories
                                </a>
                                <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                                    <!--Réafficher tous les produits sans filtre -->
                                    <a class="dropdown-item fw-bold" href="{% url 'home' %}">Toutes les catégories</a>
                                    <div class="dropdown-divider"></div>
                                    <!--Boucle dynamique sur toutes les catégories de la BD -->
                                    {% for cat in categories %}
                                        <a class="dropdown-item" href="{% url 'product_by_category' cat.id %}">
                                            {{ cat.name }}
                                        </a>
                                    {% empty %}
                                        <span class="dropdown-item disabled">Aucune catégorie disponible</span>
                                    {% endfor %}  
                                </div>
                            </li>
                        </ul>
                    </div>
                </nav>
            </div>
        </div>

        <!-- Contenu principal de chaque page -->
        {% block content %}
            
        {% endblock content %}
    </div>

    <!-- Bibliothèques JavaScript Bootstrap & jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

    <!-- Zone réservée aux scripts spécifiques des pages filles -->
    {% block js %}
        
    {% endblock js %}
</body>
</html>
