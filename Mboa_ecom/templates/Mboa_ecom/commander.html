{% extends 'Mboa_ecom/base.html' %}


{% block content %}
    <div class="row my-4">
        <div class="col-md-12 mx-auto">
            <div class="card shadow-sm border-1">
                <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center fw-bold">
                    <span><i class="bi bi-cart-check me-2"></i>Récapitulatif de votre commande</span>
                    <span class="badge bg-danger rounded-pill" id="total-items">0 article(s)</span>
                </div>
                
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush" id="item-product">
                        <!-- Les éléments JS  ici -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="row my-5">
        <div class="col-md-12">
            <form method="POST" class="card card-body shadow-sm border-2 my-4">
                <input type="hidden" id="items" name="items">
                {% csrf_token %}
                <!-- Nom et Email -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="nom" class="form-label fw-bold">Nom complet</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="nom" name="nom" placeholder="laura" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="inputEmail4" class="form-label fw-bold">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="laura@mail.com" required>
                        </div>
                    </div>
                </div>
                <!-- Adresse principale -->
                <div class="mb-3">
                    <label for="inputAddress" class="form-label fw-bold">Adresse de livraison</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-geo-alt"></i></span>
                        <input type="text" class="form-control" id="adresse" name="adresse" placeholder="Quartier, Rue, N° de porte" required>
                    </div>
                </div>
                <!-- Ville, Région -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="inputCity" class="form-label fw-bold">Ville</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-buildings"></i></span>
                            <input type="text" class="form-control" id="ville" name="ville" placeholder="Douala, Yaoundé..." required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label for="inputState" class="form-label fw-bold">Région</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-globe"></i></span>
                            <select id="region" name="region" class="form-select" required>
                                <option value="" selected disabled>Nord-Ouest</option>
                                <option value="Littoral">Littoral</option>
                                <option value="Centre">Centre</option>
                                <option value="Ouest">Ouest</option>
                                <option value="Est">Est</option>
                                <option value="Ebolowa">Ebolowa</option>
                                <option value="Sud">Sud</option>
                                <option value="Nord">Nord</option>
                                <option value="Sud-Ouest">Sud-Ouest</option>
                                <option value="Adamaoua">Adamaoua</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label for="inputZip" class="form-label fw-bold">Code Postal</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-mailbox"></i></span>
                            <input type="text" class="form-control" id="zip" name="zip" placeholder="00237">
                        </div>
                    </div>
                </div>
                <div class="row g-5 mb-4">
                    <div class="col-md-8 center-block">
                        <label for="toal" class="form-label fw-bold text-success">Net à payer</label>
                    <input type="readonly" class="form-control" id="totalPayer" name="total">
                    </div>
                </div>
                <!-- Bouton de confirmation -->
                <button type="submit" class="btn btn-success btn-lg fw-bold w-100 mt-2">
                    <i class="bi bi-check-circle me-1"></i> Confirmer la commande
                </button>
            </form>
        </div>
    </div>
{% endblock content %}


{% block js %}
    <script type="text/javascript">
         if (localStorage.getItem('panier') == null) {
            var panier = {};
        } else {
            panier = JSON.parse(localStorage.getItem('panier'));
        }
        var totalArticles = 0;
        var total = 0;
        // Si le panier est vide
        if ($.isEmptyObject(panier)) {
            let emptyMessage = `
                <li class="list-group-item text-center py-5 text-muted">
                    <h5>Votre panier est actuellement vide</h5>
                </li>`;
            $('#item-product').append(emptyMessage);
        } else {
        // Parcours du panier
            for (item in panier) {
                let name = panier[item][1];
                let quantite = panier[item][0];
                let prix = panier[item][2];
                totalArticles += quantite;
                total += prix;
                let itemProduct = `
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <div class="fw-semibold text-dark">
                            ${name}
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge bg-secondary rounded-pill fs-6 px-3 py-2">
                                ${prix} XAF
                            </span>
                            <span class="badge bg-info rounded-pill fs-6 px-3 py-2">
                                Quantité : ${quantite}
                            </span>
                           
                        </div>
                    </li>`;
                
                    $('#item-product').append(itemProduct);
            }
            let itemTotal = `
                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                    <div class="fw-semibold text-dark">
                        Prix total:
                    </div>
                    <span class="badge bg-success rounded-pill fs-6 px-3 py-2">
                        ${total} XAF
                    </span>
                </li>`;     
                $('#item-product').append(itemTotal);
                $('#totalPayer').val(total + "XAF");
  
        }
        document.getElementById('total-items').innerHTML = totalArticles + " article(s)";
        $('#items').val(JSON.stringify(panier))

    </script>
{% endblock js %}
